# uXRCE-DDS agent (MicroXRCEAgent). Edit from the Services tab.
# transport: serial (Telem2 UART), ethernet (UDP), or tcp.
# Default transport and serial device are filled per platform at package build.

transport = "@DDS_TRANSPORT@"
transport_options = ["serial", "ethernet", "tcp"]

# serial
device = "@DDS_DEVICE@"
baudrate = 3000000

# ethernet / tcp — agent listens on all interfaces; match PX4 UXRCE_DDS_PRT.
# address is the companion IP the flight controller should use (UXRCE_DDS_AG_IP).
port = 8888
address = "0.0.0.0"
